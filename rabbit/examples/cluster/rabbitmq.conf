# узлы находят друг друга по списку и сами собираются в кластер
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3

# Prometheus (порт 15692): /metrics отдаёт агрегированные метрики — это значение
# по умолчанию; метрики по каждой очереди — на /metrics/per-object и /metrics/detailed (модуль 16.1)
prometheus.return_per_object_metrics = false

# stream-протокол (модуль 10.4): по умолчанию узел сообщает клиентам своё имя хоста
# (rabbit-1), которое с машины разработчика не резолвится. Сообщаем localhost,
# а порт у каждого узла свой: stream/rabbit-N.conf, подключается как conf.d/20-stream.conf
stream.advertised_host = localhost
